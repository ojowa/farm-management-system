services:
  # ──────────────────────────────────────────────
  # PostgreSQL Database
  # ──────────────────────────────────────────────
  - type: database
    name: fms-database
    plan: starter
    databaseName: FMS
    ipAllowList: []

  # ──────────────────────────────────────────────
  # API Gateway — Port 4000
  # ──────────────────────────────────────────────
  - type: web
    name: api-gateway
    plan: standard
    runtime: node
    buildCommand: pnpm install && pnpm --filter @farm/api-gateway run build
    startCommand: pnpm --filter @farm/api-gateway run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: fms-database
          property: connectionString
      - key: DIRECT_DATABASE_URL
        fromDatabase:
          name: fms-database
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: MFA_SECRET
        sync: false
      - key: SERVICE_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
    dependsOn:
      - auth-service
      - farm-service
      - livestock-service
      - poultry-service
      - notification-service
      - finance-service
      - worker-service
      - reporting-service
      - organization-service
      - inventory-service
      - crop-service
      - hr-service
      - platform-service

