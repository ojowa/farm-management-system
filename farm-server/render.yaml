# Render Blueprint — FMS API (farm-server)
#
# This blueprint lives INSIDE farm-server so the backend can be managed on its
# own. Render does not auto-detect it: you must point a Blueprint at it.
#
#   Render Dashboard → New → Blueprint → connect ojowa/farm-management-system
#   → branch main → Blueprint Path: farm-server/render.yaml → Deploy Blueprint
#
# (If the blueprint already exists, set the path on its Settings page.)
#
# On review, Render will offer to ADOPT your existing API service — the service
# `name` below must match the existing service's name in the dashboard or a
# brand-new service gets created instead. Change `name:` if yours differs.
#
# Notes:
#   - rootDir / buildCommand / startCommand / preDeployCommand paths are
#     relative to the repository root (rootDir) and to rootDir (commands).
#   - Do NOT let a second blueprint (e.g. the repo-root render.yaml) manage
#     this same service — one resource, one blueprint. The root render.yaml
#     also defines fms-api; remove it from there once this blueprint is live.
#   - ALL environment variables (DATABASE_URL, secrets, *_SERVICE_URL, CORS
#     origins, etc.) are managed manually in the Render Dashboard — this
#     blueprint only defines how to build and run farm-server. See the
#     commented checklist at the bottom of this file.
#
# Deploy: Render Dashboard → New → Blueprint → point at this file.

services:
  - type: web
    name: fms-api
    runtime: node
    plan: free
    # Working directory is farm-server; the repo root is still checked out, so
    # app-server/tsconfig.json (../../) and packages/server/*/tsconfig.json
    # (../../../../) reach the shared tsconfig.base.json at the repo root.
    rootDir: farm-server
    # --include=dev is REQUIRED: NODE_ENV=production (env var below) is visible
    # at build time, and npm then skips devDependencies — which removes
    # `typescript` and `@types/node`, so `tsc` falls back to Render's system
    # TypeScript and fails with TS5102/TS5108 ("baseUrl"/"node10" removed)
    # and TS2688 (cannot find type definition 'node'). Forcing --include=dev
    # installs the exact lockfile versions (typescript 5.8.3) regardless of
    # NODE_ENV; npm run scripts then pick the local tsc ahead of any global one.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node scripts/start-prod.js
    preDeployCommand: npm run migrate
    healthCheckPath: /v1/health
    # NOTE: no envVars here on purpose — all env vars are managed in the
    # Render Dashboard (Environment page) for this service.

# ---------------------------------------------------------------------------
# Environment variables to set in the Render Dashboard → service → Environment.
# (Comments only — the blueprint deliberately does not manage any of them.)
# Without the *_SERVICE_URL vars the gateway proxies to ports 4010-4020 where
# nothing listens in merged-process mode, so those are REQUIRED, not optional.
#
#   NODE_VERSION=20
#   NODE_ENV=production
#   DOMAINS_SERVICE_PORT=4099
#   AUTH_SERVICE_URL=http://localhost:4099
#   FARM_SERVICE_URL=http://localhost:4099
#   CROP_SERVICE_URL=http://localhost:4099
#   LIVESTOCK_SERVICE_URL=http://localhost:4099
#   POULTRY_SERVICE_URL=http://localhost:4099
#   FINANCE_SERVICE_URL=http://localhost:4099
#   HR_SERVICE_URL=http://localhost:4099
#   NOTIFICATION_SERVICE_URL=http://localhost:4099
#   ORGANIZATION_SERVICE_URL=http://localhost:4099
#   PLATFORM_SERVICE_URL=http://localhost:4099
#   REPORTING_SERVICE_URL=http://localhost:4099
#   DATABASE_URL=postgresql://... (Neon, sslmode=require)
#   JWT_SECRET=...            (generate)
#   JWT_REFRESH_SECRET=...    (generate)
#   MFA_SECRET=...            (generate)
#   SERVICE_SECRET=...        (generate)
#   CORS_ORIGINS=https://farm-management-system-lake.vercel.app,https://farm-management-system-three-navy.vercel.app
#   COOKIE_SAMESITE=none
#   ADMIN_URL=https://farm-management-system-lake.vercel.app
#   CONSOLE_URL=https://farm-management-system-three-navy.vercel.app/login
#   MOBILE_URL=https://fms-mobile-3an1wd.vercel.app
