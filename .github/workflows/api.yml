name: API CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'farm-server/**'
      - '.github/workflows/api.yml'
  pull_request:
    branches: [main]
    paths:
      - 'farm-server/**'
      - '.github/workflows/api.yml'

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: farm-server/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: farm-server

      - name: Build workspace packages & app-server
        run: npm run build
        working-directory: farm-server

      - name: Run tests
        run: npm test
        working-directory: farm-server
