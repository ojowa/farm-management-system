name: CD

on:
  push:
    branches: [main]

env:
  NODE_VERSION: '22'

jobs:
  detect-changes:
    name: Detect changed packages
    runs-on: ubuntu-latest
    outputs:
      admin: ${{ steps.filter.outputs.admin }}
      console: ${{ steps.filter.outputs.console }}
      mobile: ${{ steps.filter.outputs.mobile }}
      server: ${{ steps.filter.outputs.server }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed packages
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            admin:
              - 'farm-client/admin/**'
            console:
              - 'farm-client/console/**'
            mobile:
              - 'farm-client/mobile/**'
            server:
              - 'farm-server/**'

  deploy-admin:
    name: Deploy admin to Vercel
    needs: detect-changes
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.admin == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install admin dependencies
        working-directory: farm-client/admin
        run: npm install

      - name: Build admin
        working-directory: farm-client/admin
        run: npm run build

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_ADMIN_PROJECT_ID }}
          vercel-args: '--prod'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  deploy-console:
    name: Deploy console to Vercel
    needs: detect-changes
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.console == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install console dependencies
        working-directory: farm-client/console
        run: npm install

      - name: Build console
        working-directory: farm-client/console
        run: npm run build

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_CONSOLE_PROJECT_ID }}
          vercel-args: '--prod'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  build-mobile:
    name: Build mobile (EAS)
    needs: detect-changes
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.mobile == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install mobile dependencies
        working-directory: farm-client/mobile
        run: npm install

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Build Android preview
        working-directory: farm-client/mobile
        run: eas build --platform android --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS preview
        working-directory: farm-client/mobile
        run: eas build --platform ios --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  build-server:
    name: Build server Docker image
    needs: detect-changes
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.server == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/farm-server
          tags: |
            type=sha
            type=ref,event=branch

      - name: Build and push server image
        uses: docker/build-push-action@v5
        with:
          context: farm-server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}
