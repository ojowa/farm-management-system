name: Deploy Admin to cPanel

# Deploys farm-client/admin through cPanel's Git Version Control feature:
# GitHub tells cPanel to pull the branch, cPanel runs .cpanel.yml.
#
# Required repository secrets:
#   CPANEL_HOST       e.g. https://example.com  (protocol included, no port)
#   CPANEL_USERNAME   cPanel account username that owns the API token
#   CPANEL_TOKEN      cPanel API token (cPanel >> User >> API Tokens)
#   CPANEL_REPO_ROOT  absolute path of the cPanel-managed clone,
#                     e.g. /home/example/farm-management-system
# Optional repository variables:
#   CPANEL_API_PORT      default 2083
#   CPANEL_BRANCH        default main (push events always deploy the pushed branch)
#   CPANEL_DEPLOY_TIMEOUT seconds to wait for cPanel to finish, default 900
#                        (npm ci + next build on the server takes several minutes)
#
# cPanel prerequisites: the repository is cloned in Git Version Control, has a
# clean working tree, and contains the checked-in .cpanel.yml.

on:
  push:
    branches: [main]
    paths:
      - 'farm-client/admin/**'
      - 'tsconfig.base.json'
      - '.cpanel.yml'
      - '.github/workflows/deploy-admin-cpanel.yml'
  workflow_dispatch:
    inputs:
      branch:
        description: Branch cPanel should pull and deploy
        required: false
        default: main

concurrency:
  group: deploy-admin-cpanel
  cancel-in-progress: false

jobs:
  deploy:
    name: Trigger cPanel Git deployment
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
      CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
      CPANEL_REPO_ROOT: ${{ secrets.CPANEL_REPO_ROOT }}
      CPANEL_API_PORT: ${{ vars.CPANEL_API_PORT || '2083' }}
      BRANCH: ${{ github.event.inputs.branch || github.ref_name }}
      MAX_WAIT: ${{ vars.CPANEL_DEPLOY_TIMEOUT || '900' }}
      AUTH: cpanel ${{ secrets.CPANEL_USERNAME }}:${{ secrets.CPANEL_TOKEN }}
      API: ${{ secrets.CPANEL_HOST }}:${{ vars.CPANEL_API_PORT || '2083' }}/execute
    steps:
      - name: Validate configuration
        run: |
          missing=0
          for v in CPANEL_HOST CPANEL_USERNAME CPANEL_TOKEN CPANEL_REPO_ROOT; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret $v is not set"
              missing=1
            fi
          done
          exit "$missing"

      - name: Update cPanel repository from GitHub
        run: |
          resp=$(curl -sS -H "Authorization: $AUTH" --get "$API/VersionControl/update" \
            --data-urlencode "repository_root=$CPANEL_REPO_ROOT" \
            --data-urlencode "branch=$BRANCH")
          echo "$resp"

          status=$(echo "$resp" | jq -r '((.result // .) | .status) // 0')
          if [ "$status" != "1" ]; then
            echo "::error::cPanel failed to pull branch '$BRANCH' from GitHub"
            echo "$resp" | jq -r '((.result // .) | .errors) // [] | .[] | tostring'
            exit 1
          fi

      - name: Deploy HEAD commit and wait for completion
        run: |
          resp=$(curl -sS -H "Authorization: $AUTH" --get "$API/VersionControlDeployment/create" \
            --data-urlencode "repository_root=$CPANEL_REPO_ROOT")
          echo "$resp"

          status=$(echo "$resp" | jq -r '((.result // .) | .status) // 0')
          task_id=$(echo "$resp" | jq -r '((.result // .) | (.data // .) | .task_id) // empty')
          log_path=$(echo "$resp" | jq -r '((.result // .) | (.data // .) | .log_path) // empty')

          if [ "$status" != "1" ] || [ -z "$task_id" ]; then
            echo "::error::cPanel did not start a deployment task"
            echo "$resp" | jq -r '((.result // .) | .errors) // [] | .[] | tostring'
            exit 1
          fi

          echo "Deployment task: $task_id"
          if [ -n "$log_path" ]; then
            echo "Server log: $log_path"
          fi

          for i in $(seq 1 "$MAX_WAIT"); do
            poll=$(curl -sS -H "Authorization: $AUTH" --get "$API/VersionControlDeployment/retrieve")
            state=$(echo "$poll" | jq -r --arg id "$task_id" '
              ((.result // .) | .data) // []
              | [ .[] | select(.task_id == $id) ]
              | (.[0] // {})
              | (.timestamps // {})
              | if   .failed    != null then "failed"
                elif .canceled  != null then "canceled"
                elif .succeeded != null then "succeeded"
                else "running" end')

            case "$state" in
              succeeded)
                echo "Deployment succeeded after ${i}s"
                exit 0
                ;;
              failed|canceled)
                echo "::error::cPanel deployment $state (task $task_id)"
                if [ -n "$log_path" ]; then
                  echo "Server log: $log_path"
                fi
                echo "$poll" | jq -r '((.result // .) | .messages) // [] | .[] | tostring'
                exit 1
                ;;
            esac
            sleep 1
          done

          echo "::error::Timed out after ${MAX_WAIT}s waiting for cPanel deployment $task_id"
          if [ -n "$log_path" ]; then
            echo "Server log: $log_path"
          fi
          exit 1
