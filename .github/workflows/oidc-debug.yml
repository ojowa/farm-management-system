name: oidc-debug

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check secret values (yes/no only)
        env:
          CID: ${{ secrets.AZUREAPPSERVICE_CLIENTID_9A020C513041408A88B625E2FDF5D29B }}
          TEN: ${{ secrets.AZUREAPPSERVICE_TENANTID_D550DCAB39014F67A22D3D428F754602 }}
          SID: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B30980BC42994A16BD8F3DA2B4771320 }}
        run: |
          echo "clientid_match=$([ "$CID" = '1283cc13-efe7-4ec7-853c-5c3cbcf6f68e' ] && echo YES || echo NO)"
          echo "tenant_match=$([ "$TEN" = '0ee13149-8b58-4089-a608-2723f4fa3aaa' ] && echo YES || echo NO)"
          echo "subid_match=$([ "$SID" = 'c485872e-b5fd-4b03-87e8-9f353e912e29' ] && echo YES || echo NO)"
          echo "cid_len=${#CID} ten_len=${#TEN} sid_len=${#SID}"

      - name: Mint OIDC token and show claims
        env:
          CID: ${{ secrets.AZUREAPPSERVICE_CLIENTID_9A020C513041408A88B625E2FDF5D29B }}
          TEN: ${{ secrets.AZUREAPPSERVICE_TENANTID_D550DCAB39014F67A22D3D428F754602 }}
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" | jq -r .value)
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2)
          echo "$PAYLOAD" | tr '_-' '/+' | base64 -d 2>/dev/null | jq '{iss,sub,aud,tid,appid,exp}' || echo "decode failed"
          echo "=== az login (raw stderr) ==="
          az login --service-principal -u "$CID" -t "$TEN" --federated-token "$TOKEN" --output none 2>&1 | sed -e 's/.\{60\}/&\n/g'
          echo "az_login_rc=${PIPESTATUS[0]}"
          echo "=== az account list ==="
          az account list -o json 2>&1
          echo "=== az account show ==="
          az account show -o json 2>&1 | head -30
