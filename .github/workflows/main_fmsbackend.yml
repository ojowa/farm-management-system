# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - fmsbackend-ca

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout
    defaults:
      run:
        working-directory: farm-server

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: farm-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema packages/server/database/prisma/schema.prisma

      - name: Build server (workspace packages + all app-server services)
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Prune dev dependencies
        run: npm prune --omit=dev

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: farm-server
          # node_modules/.prisma (generated Prisma client) is a hidden dir.
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact for deployment job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_9A020C513041408A88B625E2FDF5D29B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D550DCAB39014F67A22D3D428F754602 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B30980BC42994A16BD8F3DA2B4771320 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'fmsbackend-ca'
          resource-group-name: 'ojchat'
          slot-name: 'Production'
          package: .
          # Run the merged production mode (gateway :$PORT + domains :4099).
          startup-command: 'node farm-server/scripts/start-prod.js'
