name: Web CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'farm-client/console/**'
      - '.github/workflows/web.yml'
  pull_request:
    branches: [main]
    paths:
      - 'farm-client/console/**'
      - '.github/workflows/web.yml'

jobs:
  build-and-typecheck:
    name: Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: farm-client/console/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: farm-client/console

      - name: Build packages & app
        run: npm run build
        working-directory: farm-client/console

      - name: Type check
        run: npx tsc --noEmit
        working-directory: farm-client/console

      - name: Run tests
        run: npm test --if-present
        working-directory: farm-client/console
