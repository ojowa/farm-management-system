name: Mobile CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'farm-client/mobile/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    branches: [main]
    paths:
      - 'farm-client/mobile/**'
      - '.github/workflows/mobile.yml'

jobs:
  typecheck-and-test:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: farm-client/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: farm-client/mobile

      - name: Type check
        run: npm run typecheck
        working-directory: farm-client/mobile

      - name: Run tests
        run: npm test
        working-directory: farm-client/mobile
