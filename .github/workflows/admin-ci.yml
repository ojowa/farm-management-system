name: Admin CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install
        working-directory: farm-client

      - name: Build workspace dependencies
        run: npm run build -w @farm/types && npm run build -w @farm/validation && npm run build -w @farm/auth

      - name: Type check
        run: npx tsc --noEmit
        working-directory: farm-client/admin

      - name: Run tests
        run: npm test
        working-directory: farm-client/admin

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: admin-build
          path: farm-client/admin/.next
          retention-days: 7
