  # Auth Service
  - type: web
    name: auth-service
    plan: starter
    runtime: node
    buildCommand: |
      corepack enable
      pnpm install --frozen-lockfile
      pnpm --filter @farm/database build
      pnpm --filter @farm/types build
      pnpm --filter @farm/utils build
      pnpm --filter @farm/auth build
      pnpm --filter @farm/validation build
      pnpm --filter @farm/auth-service build
    startCommand: pnpm --filter @farm/auth-service start
    envVars:
      - key: DATABASE_URL
        value: "postgresql://neondb_owner:npg_Q8BXmCJSbt3i@ep-crimson-recipe-a4vfpflj-pooler.us-east-1.aws.neon.tech/FMS?sslmode=require"
      - key: DIRECT_DATABASE_URL
        value: "postgresql://neondb_owner:npg_Q8BXmCJSbt3i@ep-crimson-recipe-a4vfpflj.us-east-1.aws.neon.tech/FMS?sslmode=require"
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: "7d"
      - key: AUTH_SERVICE_PORT
        value: "4001"

