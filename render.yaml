# Render Blueprint — Farm Management System
#
# Provisions three web services:
#   fms-api    — NestJS gateway + microservices (farm-server)
#   fms-admin  — Next.js admin dashboard  (farm-client/admin)
#   fms-console— Next.js platform console (farm-client/console)
#
# Database is NOT provisioned here — use Neon (free tier) and paste the
# connection string into DATABASE_URL (sync: false) in the Render dashboard.
#
# Deploy: Render Dashboard → New → Blueprint → point at this repo.
# After the first deploy, verify the auto-generated *.onrender.com domains
# and update CORS_ORIGINS / NEXT_PUBLIC_* below if they differ.

services:
  - type: web
    name: fms-api
    runtime: node
    plan: free
    # Working directory is farm-server; the repo root is still checked out, so
    # app-server/tsconfig.json (../../) and packages/server/*/tsconfig.json
    # (../../../../) reach the shared tsconfig.base.json at the repo root.
    rootDir: farm-server
    # --include=dev is REQUIRED: NODE_ENV=production (env var below) is visible
    # at build time, and npm then skips devDependencies — which removes
    # `typescript` and `@types/node`, so `tsc` falls back to Render's system
    # TypeScript and fails with TS5102/TS5108 ("baseUrl"/"node10" removed)
    # and TS2688 (cannot find type definition 'node'). Forcing --include=dev
    # installs the exact lockfile versions (typescript 5.8.3) regardless of
    # NODE_ENV; npm run scripts then pick the local tsc ahead of any global one.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node scripts/start-prod.js
    preDeployCommand: npm run migrate
    healthCheckPath: /v1/health
    envVars:
      # Node 20 - the backend targets NestJS 11, which requires >= 20.
      - key: NODE_VERSION
        value: "20"
      # Merged-process mode: all domain services run in one container (port 4099),
      # the gateway (PORT) proxies to them via these URLs. Keeps free tier = 1 instance.
      - key: DOMAINS_SERVICE_PORT
        value: "4099"
      - key: AUTH_SERVICE_URL
        value: http://localhost:4099
      - key: FARM_SERVICE_URL
        value: http://localhost:4099
      - key: CROP_SERVICE_URL
        value: http://localhost:4099
      - key: LIVESTOCK_SERVICE_URL
        value: http://localhost:4099
      - key: POULTRY_SERVICE_URL
        value: http://localhost:4099
      - key: FINANCE_SERVICE_URL
        value: http://localhost:4099
      - key: HR_SERVICE_URL
        value: http://localhost:4099
      - key: NOTIFICATION_SERVICE_URL
        value: http://localhost:4099
      - key: ORGANIZATION_SERVICE_URL
        value: http://localhost:4099
      - key: PLATFORM_SERVICE_URL
        value: http://localhost:4099
      - key: REPORTING_SERVICE_URL
        value: http://localhost:4099
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Neon Postgres connection string (sslmode=require)
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: MFA_SECRET
        generateValue: true
      - key: SERVICE_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://farm-management-system-lake.vercel.app,https://farm-management-system-three-navy.vercel.app
      - key: COOKIE_SAMESITE
        value: none
      - key: ADMIN_URL
        value: https://farm-management-system-lake.vercel.app
      - key: CONSOLE_URL
        value: https://farm-management-system-three-navy.vercel.app/login
      - key: MOBILE_URL
        value: https://fms-mobile-3an1wd.vercel.app
      # Object storage for document uploads (S3-compatible, e.g. Cloudflare R2).
      # Leave STORAGE_DRIVER unset so the driver auto-selects "s3" when a bucket
      # is configured, otherwise it falls back to local disk. Values here can
      # also be overridden at runtime from the console (stored in the database).
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

  - type: web
    name: fms-admin
    runtime: node
    plan: free
    rootDir: farm-client/admin
    buildFilter:
      paths:
        - farm-client/admin/**
        - tsconfig.base.json
    buildCommand: npm ci && npm run build
    startCommand: npx next start -p $PORT
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://fms-api.onrender.com/v1
      - key: NEXT_PUBLIC_SOCKET_URL
        value: https://fms-api.onrender.com

  - type: web
    name: fms-console
    runtime: node
    plan: free
    rootDir: farm-client/console
    buildFilter:
      paths:
        - farm-client/console/**
        - tsconfig.base.json
    buildCommand: npm ci && npm run build
    startCommand: npx next start -p $PORT
    envVars:
      - key: API_GATEWAY_URL
        value: https://fms-api.onrender.com/v1
