version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: farm_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: farm_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: farm_redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
