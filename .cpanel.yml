---
# cPanel Git deployment - Farm Admin (Next.js app in farm-client/admin)
#
# * This file MUST be committed to the repository top-level directory.
# * cPanel runs each entry below as bash, in order, from the repository root,
#   as your cPanel account user, when a deployment task runs.
# * Requirements: a clean working tree and at least one local/remote branch.
#
# One-time server setup:
#   1. cPanel -> "Setup Node.js App" (or Web Apps) -> create an app whose
#      directory is $DEPLOYROOT/farm-client/admin, Node.js 20+,
#      startup command "npm start" (runs `next start -p 4003`).
#   2. Put $APPDIR/.env in place. .env is gitignored, so it is never deployed:
#        NEXT_PUBLIC_API_URL=https://api.example.com/v1
#   3. Adjust DEPLOYROOT below if you want a different location.
#
# Notes:
#   * tsconfig.base.json is copied too - farm-client/admin/tsconfig.json and
#     its workspace packages extend it with relative paths.
#   * Nothing is deleted before extraction, so .env and tmp/ survive deploys.
deployment:
  tasks:
    - export DEPLOYROOT="$HOME/farm-admin"
    - export APPDIR="$DEPLOYROOT/farm-client/admin"
    - mkdir -p "$APPDIR"
    - cp tsconfig.base.json "$DEPLOYROOT"/
    - tar -C farm-client/admin --exclude=node_modules --exclude=.next --exclude=coverage -cf - . | tar -C "$APPDIR" -xf -
    - cd "$APPDIR" && npm ci
    - cd "$APPDIR" && npm run build
    - mkdir -p "$APPDIR/tmp" && touch "$APPDIR/tmp/restart.txt"
